<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wedding Title Card — Joshua Brown Photography (Recoleta)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Copy your licensed Recoleta font files into the project's assets/fonts/ folder.
       Falls back to locally installed Recoleta on macOS, then Fraunces/Georgia. */
    @font-face {
      font-family: 'Recoleta';
      src: local('Recoleta'), local('Recoleta Regular'), local('Recoleta-Regular'),
           url('../assets/fonts/Recoleta-Regular.woff2') format('woff2'),
           url('../assets/fonts/Recoleta-Regular.otf') format('opentype'),
           url('../assets/fonts/Recoleta-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Recoleta';
      src: local('Recoleta Medium'), local('Recoleta-Medium'),
           url('../assets/fonts/Recoleta-Medium.woff2') format('woff2'),
           url('../assets/fonts/Recoleta-Medium.otf') format('opentype'),
           url('../assets/fonts/Recoleta-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      text-align: center;
      color: #FFFFFF;
      padding: 0 8vw;
      text-shadow: 0 2px 22px rgba(0, 0, 0, 0.32);
    }
    #couple {
      font-family: 'Recoleta', 'Fraunces', Georgia, serif;
      font-size: clamp(46px, 5.4vw, 112px);
      font-weight: 400;
      line-height: 1.06;
      letter-spacing: 0.02em;
      color: #FFFFFF;
    }
    #venue {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(12px, 1.0vw, 19px);
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      margin-top: 1.6vh;
    }
  </style>
</head>
<body>
  <!-- Joshua Brown rules:
       1. ALWAYS use the word "and", never "&".
       2. Recoleta title font, white, centered over opening nature/venue shots in first 10s. -->
  <div class="card" id="card">
    <h1 id="couple">Emma and Alex</h1>
    <p id="venue">BLOOMING HILL FARM</p>
  </div>

  <script type="module">
    const DURATION = 5.0;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
    const easeIn = (x) => Math.pow(clamp(x, 0, 1), 2);

    const card = document.getElementById('card');

    const ready = Promise.all([
      document.fonts.load('400 72px "Recoleta"'),
      document.fonts.load('400 72px "Fraunces"'),
      document.fonts.load('300 18px "Inter"'),
    ]).catch(() => {});

    window.film = {
      duration: DURATION,
      ready,
      frame(t) {
        const enter = easeOut(t / 0.85);
        const exit = 1 - easeIn((t - (DURATION - 0.8)) / 0.8);
        const alpha = clamp(enter * exit, 0, 1);
        card.style.opacity = String(alpha);
      },
    };

    if (!window.filmHost) {
      const t0 = performance.now();
      const loop = () => {
        const t = ((performance.now() - t0) / 1000) % DURATION;
        window.film.frame(t);
        requestAnimationFrame(loop);
      };
      ready.then(loop);
    }
  </script>
</body>
</html>
