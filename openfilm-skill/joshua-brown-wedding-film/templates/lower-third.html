<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Speaker Lower Third (Recoleta)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Recoleta';
      src: local('Recoleta'), local('Recoleta Regular'), local('Recoleta-Regular'),
           url('../assets/fonts/Recoleta-Regular.woff2') format('woff2'),
           url('../assets/fonts/Recoleta-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      position: fixed;
      left: 6vw;
      bottom: 8.5vh;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 14px 22px 14px 18px;
      background: linear-gradient(90deg, rgba(18, 15, 12, 0.56) 0%, rgba(18, 15, 12, 0.22) 100%);
      backdrop-filter: blur(4px);
      border-radius: 4px;
    }
    .bar {
      width: 2px;
      height: 46px;
      background: rgba(255, 255, 255, 0.78);
      transform-origin: top center;
    }
    #speaker {
      font-family: 'Recoleta', 'Fraunces', Georgia, serif;
      font-size: clamp(24px, 2.2vw, 42px);
      font-weight: 400;
      line-height: 1.08;
      color: #FFFFFF;
    }
    #role {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(11px, 0.9vw, 16px);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="bar" id="bar"></div>
    <div>
      <div id="speaker">Daniel Miller</div>
      <div id="role">BEST MAN</div>
    </div>
  </div>

  <script type="module">
    const DURATION = 4.5;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const easeOut = (x) => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
    const easeIn = (x) => Math.pow(clamp(x, 0, 1), 2);

    const wrap = document.getElementById('wrap');
    const bar = document.getElementById('bar');

    const ready = Promise.all([
      document.fonts.load('400 36px "Recoleta"'),
      document.fonts.load('400 36px "Fraunces"'),
      document.fonts.load('500 14px "Inter"'),
    ]).catch(() => {});

    window.film = {
      duration: DURATION,
      ready,
      frame(t) {
        const enter = easeOut(t / 0.7);
        const exit = 1 - easeIn((t - (DURATION - 0.65)) / 0.65);
        const alpha = clamp(enter * exit, 0, 1);
        const x = (1 - enter) * -10;
        wrap.style.opacity = String(alpha);
        wrap.style.transform = `translate3d(${x.toFixed(2)}px, 0, 0)`;
        bar.style.transform = `scaleY(${enter.toFixed(3)})`;
      },
    };

    if (!window.filmHost) {
      const t0 = performance.now();
      const loop = () => {
        const t = ((performance.now() - t0) / 1000) % DURATION;
        window.film.frame(t);
        requestAnimationFrame(loop);
      };
      ready.then(loop);
    }
  </script>
</body>
</html>
